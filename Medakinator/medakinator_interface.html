<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedAkinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5F3;
    --surface:#FFFFFF;
    --ink:#152420;
    --muted:#5D6D67;
    --accent:#0F6B5C;
    --accent-ink:#F2F5F3;
    --accent-soft:#DCEEE9;
    --line:#DDE5E1;
    --no:#8A4A44;
    --radius:18px;
    --serif:'Fraunces',Georgia,serif;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0E1512;
      --surface:#152420;
      --ink:#EAF1EE;
      --muted:#9FB0A9;
      --accent:#3FCBAE;
      --accent-ink:#0E1512;
      --accent-soft:#1C332C;
      --line:#26382F;
      --no:#D98F87;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1512;
    --surface:#152420;
    --ink:#EAF1EE;
    --muted:#9FB0A9;
    --accent:#3FCBAE;
    --accent-ink:#0E1512;
    --accent-soft:#1C332C;
    --line:#26382F;
    --no:#D98F87;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .progress-track{
    width:100%;
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .step-label{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    min-height:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0;
  }
  .headline{
    font-family:var(--serif);
    font-size:28px;
    font-weight:560;
    line-height:1.15;
    margin:0;
  }
  .question{
    font-family:var(--serif);
    font-size:24px;
    font-weight:560;
    line-height:1.25;
    margin:0;
  }
  .lede{
    font-size:15px;
    line-height:1.5;
    color:var(--muted);
    margin:0;
  }
  .btn{
    font-family:var(--sans);
    font-size:15px;
    font-weight:500;
    padding:14px 20px;
    border-radius:12px;
    border:1px solid transparent;
    cursor:pointer;
    text-align:center;
  }
  .btn-yes{ background:var(--accent); color:var(--accent-ink); }
  .btn-no{ background:transparent; color:var(--no); border-color:var(--no); }
  .btn-unknown{ background:transparent; color:var(--muted); border-color:var(--line); }
  .btn-outline{ background:transparent; color:var(--accent); border-color:var(--accent); }
  .answers{ display:flex; flex-direction:column; gap:10px; }
  .link-btn{
    background:none; border:none; color:var(--muted);
    font-size:13px; text-decoration:underline; cursor:pointer;
    padding:4px 0; align-self:flex-start;
  }
  .results{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .result-row{ display:flex; align-items:center; gap:10px; }
  .rank{
    font-family:var(--mono); font-size:13px; color:var(--muted);
    width:18px;
  }
  .name{ flex:1; font-weight:500; }
  .pct{ font-family:var(--mono); font-size:13px; color:var(--muted); }
  .bar{ height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-left:28px; }
  .bar-fill{ height:100%; width:0%; background:var(--accent); transition:width .6s ease; }
  .disclaimer{
    font-size:12px; color:var(--muted); text-align:center; line-height:1.5;
  }
</style>
</head>
<body>
<div class="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-label" id="stepLabel"></div>
  <main class="card" id="card"></main>
  <footer class="disclaimer">Hasil sistem pakar berbasis data, bukan diagnosis medis. Konsultasikan ke dokter atau tenaga medis untuk kepastian.</footer>
</div>

<script type="application/json" id="modelData">__MED_DATA_JSON__</script>
<script>
(function(){
  const raw = JSON.parse(document.getElementById('modelData').textContent);
  const nd = raw.nd, ns = raw.ns;
  const diseases = raw.diseases, symptoms = raw.symptoms;

  function b64ToBytes(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return arr;
  }
  const P8 = b64ToBytes(raw.P_b64);       // nd*ns, row-major (disease-major)
  const prior8 = b64ToBytes(raw.prior_b64);

  const P = new Float32Array(nd*ns);
  for(let i=0;i<P.length;i++) P[i]=P8[i]/255;

  let priorSum=0;
  for(let i=0;i<nd;i++) priorSum+=prior8[i];
  const prior = new Float32Array(nd);
  for(let i=0;i<nd;i++) prior[i]=prior8[i]/priorSum;

  let posterior, asked, askedCount, H_INITIAL;
  function resetModel(){
    posterior = Float32Array.from(prior);
    asked = new Uint8Array(ns);
    askedCount = 0;
    H_INITIAL = entropy(posterior); // dipakai utk hitung progress eksplorasi
  }

  function entropy(arr){
    let h=0;
    for(let i=0;i<arr.length;i++){ const x=arr[i]; if(x>1e-12) h-=x*Math.log2(x); }
    return h;
  }

  function bestNextSymptom(){
    const H0 = entropy(posterior);
    let bestIdx=-1, bestGain=1e-9;
    for(let s=0;s<ns;s++){
      if(asked[s]) continue;
      let p1=0;
      for(let d=0;d<nd;d++) p1 += posterior[d]*P[d*ns+s];
      const p0=1-p1;
      if(p1<1e-6 || p0<1e-6) continue;
      let Hy=0, Hn=0;
      for(let d=0;d<nd;d++){
        const py = posterior[d]*P[d*ns+s]/p1;
        if(py>1e-12) Hy -= py*Math.log2(py);
        const pn = posterior[d]*(1-P[d*ns+s])/p0;
        if(pn>1e-12) Hn -= pn*Math.log2(pn);
      }
      const gain = H0 - (p1*Hy + p0*Hn);
      if(gain>bestGain){ bestGain=gain; bestIdx=s; }
    }
    return bestIdx===-1 ? null : {idx:bestIdx, gain:bestGain};
  }

  function update(idx, ans){
    asked[idx]=1; askedCount++;
    if(ans==='u') return;
    let total=0;
    for(let d=0;d<nd;d++){
      const p = P[d*ns+idx];
      posterior[d] *= (ans==='y' ? p : (1-p));
      total += posterior[d];
    }
    if(total>1e-12) for(let d=0;d<nd;d++) posterior[d]/=total;
  }

  function topK(k){
    const idxs = Array.from({length:nd}, (_,i)=>i).sort((a,b)=>posterior[b]-posterior[a]).slice(0,k);
    return idxs.map(i=>({name:diseases[i], p:posterior[i]}));
  }

  function titleCase(s){
    return s.replace(/\w\S*/g, t => t[0].toUpperCase()+t.slice(1));
  }

  // Tidak lagi dibatasi ke 25 pertanyaan: MAX_Q dipakai sebagai batas aman
  // saja (= seluruh gejala di dataset). Sesi berhenti lebih awal hanya jika
  // gejala informatif sudah habis, ATAU keyakinan penyakit #1 sudah tinggi
  // (CONF_STOP) DAN unggul jauh (MARGIN_STOP) dari kandidat #2 -- supaya
  // hasil akhir benar-benar valid, bukan tebakan ambigu/prematur.
  const MAX_Q = ns, CONF_STOP = 0.95, MARGIN_STOP = 0.15, MIN_Q_FOR_STOP = 5;
  const card = document.getElementById('card');
  const progressFill = document.getElementById('progressFill');
  const stepLabel = document.getElementById('stepLabel');
  let current = null;

  function renderIntro(){
    stepLabel.textContent='';
    progressFill.style.width='0%';
    card.innerHTML = `
      <p class="eyebrow">Sistem pakar tebak penyakit</p>
      <h1 class="headline">Ceritakan gejala yang Anda rasakan</h1>
      <p class="lede">Jawab pertanyaan gejala satu per satu. Di setiap langkah, sistem memilih gejala yang paling membantu mempersempit kemungkinan, dan akan terus menggali selama itu masih menambah kejelasan — bukan berhenti di jumlah tetap — lalu memberi tiga tebakan teratas begitu hasilnya cukup meyakinkan.</p>
      <button class="btn btn-yes" id="startBtn" style="align-self:flex-start;">Mulai</button>
    `;
    document.getElementById('startBtn').onclick = () => { resetModel(); nextStep(); };
  }

  function nextStep(){
    if(askedCount>=MAX_Q) return renderResults();
    const best = bestNextSymptom();
    if(!best) return renderResults();
    if(askedCount>=MIN_Q_FOR_STOP){
      const top2 = topK(2);
      const top1 = top2[0].p;
      const margin = top1 - (top2[1] ? top2[1].p : 0);
      if(top1>=CONF_STOP && margin>=MARGIN_STOP) return renderResults();
    }
    current = best;
    renderQuestion(best.idx);
  }

  function progressPct(){
    // Progres dihitung dari seberapa besar ketidakpastian (entropy) sudah
    // berkurang -- lebih bermakna daripada askedCount/25, karena sekarang
    // jumlah pertanyaan bisa menjelajahi seluruh gejala yang ada.
    if(H_INITIAL <= 1e-9) return 100;
    const H_now = entropy(posterior);
    return Math.max(0, Math.min(100, Math.round((1 - H_now/H_INITIAL)*100)));
  }

  function renderQuestion(idx){
    stepLabel.textContent = `Pertanyaan ${askedCount+1}`;
    progressFill.style.width = progressPct() + '%';
    const symptom = titleCase(symptoms[idx]);
    card.innerHTML = `
      <p class="eyebrow">Gejala</p>
      <h2 class="question">Apakah Anda mengalami ${symptom}?</h2>
      <div class="answers">
        <button class="btn btn-yes" data-a="y">Ya</button>
        <button class="btn btn-no" data-a="n">Tidak</button>
        <button class="btn btn-unknown" data-a="u">Tidak tahu</button>
      </div>
      <button class="link-btn" id="finishBtn">Selesai &amp; lihat hasil sekarang</button>
    `;
    card.querySelectorAll('.answers .btn').forEach(b=>{
      b.onclick = ()=>{ update(idx, b.dataset.a); nextStep(); };
    });
    document.getElementById('finishBtn').onclick = renderResults;
  }

  function renderResults(){
    stepLabel.textContent='Hasil';
    progressFill.style.width='100%';
    const top3 = topK(3);
    const rows = top3.map((r,i)=>{
      const pct = Math.round(r.p*1000)/10;
      return `<li>
        <div class="result-row"><span class="rank">${i+1}</span><span class="name">${titleCase(r.name)}</span><span class="pct">${pct}%</span></div>
        <div class="bar"><div class="bar-fill" data-w="${pct}"></div></div>
      </li>`;
    }).join('');
    card.innerHTML = `
      <p class="eyebrow">Berdasarkan ${askedCount} pertanyaan</p>
      <h1 class="headline">Tiga kemungkinan teratas</h1>
      <ol class="results">${rows}</ol>
      <button class="btn btn-outline" id="restartBtn">Mulai lagi</button>
    `;
    requestAnimationFrame(()=>{
      card.querySelectorAll('.bar-fill').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    });
    document.getElementById('restartBtn').onclick = renderIntro;
  }

  renderIntro();
})();
</script>
</body>
</html>
